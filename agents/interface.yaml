interface:
  display_name: "Starline Obsidian Archive"
  author: "墨点星痕 (starline)"
  short_description: "协调 Agent 长期记忆，并从批准来源生成安全的 Obsidian 索引与上下文简报"
  default_prompt: "Use $starline-obsidian-archive for Memory Coordination, approved Archive, Vault Audit, or explicit Context Brief work. Read the selected Vault policy and project context first; preserve originals; expose confirmed, derived, needs_review, and blocked states; and verify outputs. Do not scan unapproved paths, save raw chat, upload to cloud, or auto-rename notes."
  examples:
    - "把项目文件安全索引进 Obsidian，不要搬动原文件"
    - "审计 Vault 的未命名笔记和断链，但不要自动改名"
    - "用批准的项目记忆生成 ai_context.md"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic", "agent-skills-compatible", "vscode"]
  activation:
    mode: "automatic-or-manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    agent-skills-compatible: "canonical-agent-skills-source"
    vscode: "agent-skills-source-with-vscode-notes"
gates:
  library:
    - "explicit source or note-boundary approval"
    - "dry-run inventory or brief preview before first write"
    - "original-source preservation"
    - "evidence states and UTF-8/wikilink verification"
    - "passing trigger evaluation"
